{% extends 'base.html' %}
{% block title %}Access Denied (403) - RentalHub{% endblock %}

{% block content %}
<div class="container py-5 my-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4 p-5">
                <div class="text-danger mb-3">
                    <i class="fa-solid fa-shield-halved fs-1"></i>
                </div>
                <h1 class="display-6 fw-bold">403 Forbidden</h1>
                <p class="text-muted mb-4">
                    {{ exception|default:"You do not have permission to access or modify this resource." }}
                </p>
                <div>
                    <a href="{% url 'home' %}" class="btn btn-primary px-4">
                        <i class="fa-solid fa-house me-1"></i> Return Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
