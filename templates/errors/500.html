{% extends 'base.html' %}
{% block title %}Server Error (500) - RentalHub{% endblock %}

{% block content %}
<div class="container py-5 my-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4 p-5">
                <div class="text-danger mb-3">
                    <i class="fa-solid fa-server fs-1"></i>
                </div>
                <h1 class="display-5 fw-bold">500 Server Error</h1>
                <p class="text-muted mb-4">
                    An unexpected server error occurred. Our team has been notified.
                </p>
                <div>
                    <a href="{% url 'home' %}" class="btn btn-primary px-4">
                        <i class="fa-solid fa-house me-1"></i> Return to Homepage
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
