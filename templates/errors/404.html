{% extends 'base.html' %}
{% block title %}Page Not Found (404) - RentalHub{% endblock %}

{% block content %}
<div class="container py-5 my-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4 p-5">
                <div class="text-primary mb-3">
                    <i class="fa-solid fa-map-location-dot fs-1"></i>
                </div>
                <h1 class="display-5 fw-bold">404 Not Found</h1>
                <p class="text-muted mb-4">
                    The property listing, page, or resource you are looking for might have been removed, had its name changed, or is temporarily unavailable.
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="{% url 'properties:property_list' %}" class="btn btn-primary px-4">
                        <i class="fa-solid fa-magnifying-glass me-1"></i> Browse Properties
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
